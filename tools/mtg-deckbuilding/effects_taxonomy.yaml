# Specific child labels that should not inherit their Scryfall ancestor category.
overrides:
  # Draw lives under zone/draw even when Scryfall parents point at card advantage
  draw: zone/draw
  pure draw: zone/draw
  burst draw: zone/draw
  draw engine: zone/draw
  # Removal-destroy can stay under interaction/removal (inherits removal)
  removal-destroy: interaction/removal
  # Wheel is card-resource pattern
  wheel: resource/cards
  wheel one-sided: resource/cards
  wheel symmetrical: resource/cards
  # Impulse draw under resource/cards
  impulse: resource/cards
  # Battle cry is an attack trigger, not a standing anthem
  battle cry: combat/attacking
  # Sneak is under cost ignorer in Tagger; put-into-play is not cost-bypass
  sneak: zone/cheat-into-play
  sneak from library: zone/cheat-into-play
  sneak from command zone: zone/cheat-into-play
  sneak-land: resource/mana
  # Cast-from-GY permission is not recursion (return to hand)
  gives castable from graveyard: spell/cast-from-nonhand
  castable from graveyard: spell/cast-from-nonhand
  # Role-primary tuck hybrids keep their answer leaf
  removal-tuck: interaction/removal
  counterspell-tuck: spell/counter
  # Keyword-shaped cast grants: prefer recast/cast over generic cast-from-nonhand
  gives flashback: spell/recast
  gives jump-start: spell/recast
  gives escape: spell/recast
  gives harmonize: spell/recast
  gives retrace: spell/recast
  gives mayhem: spell/recast
  gives rebound: spell/recast
  gives cascade: spell/cast
  gives adventure: spell/cast
  gives foretell: spell/cast
  gives plot: spell/cast
  gives warp: spell/cast
  gives suspend: spell/cast
  gives madness: spell/cast
  gives ripple: spell/cast
